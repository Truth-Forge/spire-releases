repos:
  - repo: local
    hooks:
      - id: canonical-code-policy
        name: canonical coding policy binding
        entry: python3 /Users/jeremyserna/truth_forge/scripts/gates/code_policy.py repository --root .
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=102400]
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
